services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  livekit:
    image: livekit/livekit-server:v1.10.1
    command: ["--config", "/etc/livekit.yaml"]
    volumes:
      - ./.runtime/docker-livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "127.0.0.1:${INSTALL_LIVEKIT_PORT}:7880"
      - "127.0.0.1:${INSTALL_RTC_TCP_PORT}:${INSTALL_RTC_TCP_PORT}/tcp"
      - "127.0.0.1:${INSTALL_RTC_UDP_PORT}:${INSTALL_RTC_UDP_PORT}/udp"
      - "127.0.0.1:${INSTALL_TURN_PORT}:${INSTALL_TURN_PORT}/tcp"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  turn:
    image: coturn/coturn:4.6.3
    network_mode: service:livekit
    command: ["-c", "/etc/coturn/turnserver.conf"]
    volumes:
      - ./.runtime/docker-turn.conf:/etc/coturn/turnserver.conf:ro
    depends_on:
      livekit:
        condition: service_started
    restart: unless-stopped

  web:
    build: .
    env_file: ./.runtime/docker.env
    volumes:
      - meeting-data:/data
      - type: bind
        source: ${INSTALL_RECORDINGS_DIR}
        target: /recordings
    ports:
      - "127.0.0.1:${INSTALL_WEB_PORT}:8000"
    depends_on:
      livekit:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  egress:
    image: livekit/egress:v1.15.0
    # Share LiveKit's network namespace so loopback ICE candidates work both
    # from the host browser and from the recording browser inside Docker.
    network_mode: service:livekit
    cap_add: [SYS_ADMIN]
    shm_size: 1gb
    environment:
      EGRESS_CONFIG_FILE: /etc/egress.yaml
    volumes:
      - ./.runtime/docker-egress.yaml:/etc/egress.yaml:ro
      - type: bind
        source: ${INSTALL_RECORDINGS_DIR}
        target: /recordings
    depends_on:
      web:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8081/ >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  meeting-data:
  redis-data:
