<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flutter 控制台说明</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <main class="container">
    <header class="auth-topbar">
      <div>
        <h1>Flutter 控制台重构</h1>
        <p class="hint">已生成 Flutter Web 工程骨架，路径为 <code>flutter_dashboard/</code>。</p>
      </div>
      <a class="ghost-link" href="/dashboard">返回控制台</a>
    </header>

    <section class="card">
      <h2>本机运行步骤</h2>
      <pre>cd flutter_dashboard
flutter pub get
flutter run -d chrome</pre>
      <p class="hint">当前环境未检测到 Flutter SDK，请先在本机安装后再运行。</p>
    </section>
  </main>

</html>
